<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#bgGradient)" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Abstract Attendance Pattern - Grid of Dots -->
  <g fill="url(#iconGradient)" opacity="0.9">
    <!-- Top row -->
    <circle cx="20" cy="20" r="2.5"/>
    <circle cx="30" cy="20" r="2.5"/>
    <circle cx="40" cy="20" r="2.5"/>
    
    <!-- Middle row -->
    <circle cx="20" cy="30" r="2.5"/>
    <circle cx="30" cy="30" r="2.5"/>
    <circle cx="40" cy="30" r="2.5"/>
    
    <!-- Bottom row -->
    <circle cx="20" cy="40" r="2.5"/>
    <circle cx="30" cy="40" r="2.5"/>
    <circle cx="40" cy="40" r="2.5"/>
  </g>
  
  <!-- Connecting Lines to Show Attendance Flow -->
  <g stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="20" x2="30" y2="30"/>
    <line x1="30" y1="30" x2="40" y2="40"/>
    <line x1="20" y1="30" x2="40" y2="30"/>
  </g>
  
  <!-- Central Focus Point -->
  <circle cx="30" cy="30" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="30" cy="30" r="2" fill="#1B5E20"/>
</svg>
