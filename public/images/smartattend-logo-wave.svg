<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="28" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Wave Pattern Representing Data Flow -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9">
    <!-- Main wave -->
    <path d="M15 30 Q25 20, 35 30 T55 30" stroke-linecap="round"/>
    
    <!-- Secondary wave -->
    <path d="M15 35 Q25 25, 35 35 T55 35" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Data points on wave -->
    <circle cx="20" cy="30" r="2" fill="#FFFFFF"/>
    <circle cx="30" cy="30" r="2" fill="#FFFFFF"/>
    <circle cx="40" cy="30" r="2" fill="#FFFFFF"/>
    <circle cx="50" cy="30" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Central Node -->
  <circle cx="30" cy="30" r="4" fill="#4CAF50"/>
  <circle cx="30" cy="30" r="2" fill="#FFFFFF"/>
</svg>
