<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="28" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Minimalist Design - Three Connected Circles -->
  <g fill="#FFFFFF" opacity="0.9">
    <!-- Main circles -->
    <circle cx="25" cy="25" r="4"/>
    <circle cx="35" cy="25" r="4"/>
    <circle cx="30" cy="35" r="4"/>
    
    <!-- Connecting lines -->
    <line x1="25" y1="25" x2="35" y2="25" stroke="#4CAF50" stroke-width="2"/>
    <line x1="25" y1="25" x2="30" y2="35" stroke="#4CAF50" stroke-width="2"/>
    <line x1="35" y1="25" x2="30" y2="35" stroke="#4CAF50" stroke-width="2"/>
  </g>
  
  <!-- Central dot -->
  <circle cx="30" cy="30" r="2" fill="#1B5E20"/>
</svg>
